# Compilación en la nube de la app G'Lauren (carpeta movil/) con Codemagic.
# No necesitas Mac: Codemagic compila iPhone en sus Mac y Android en Linux.
# Guía paso a paso: movil/PUBLICAR.md
workflows:

  # 1) Revisión rápida en cada cambio: análisis de código y pruebas (no publica nada)
  revisar:
    name: Revisar app
    instance_type: linux_x2
    max_build_duration: 20
    working_directory: movil
    environment:
      flutter: stable
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: '*'
    when:
      changed:
        includes: ['movil/']
    scripts:
      - name: Preparar plataformas
        script: bash scripts/preparar_plataformas.sh
      - name: Analizar código
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        script: flutter test

  # 2) iPhone → App Store Connect (TestFlight). Se lanza a mano desde Codemagic.
  ios-app-store:
    name: iPhone · App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: movil
    integrations:
      app_store_connect: GLauren App Store   # nombre de la llave API que crees en Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chaquetasdeprom.glauren
      vars:
        APP_ID: com.chaquetasdeprom.glauren
    scripts:
      - name: Preparar plataformas
        script: bash scripts/preparar_plataformas.sh
      - name: Revisar código
        script: flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test
      - name: Perfiles de firma
        script: xcode-project use-profiles
      - name: CocoaPods
        script: cd ios && pod install --repo-update
      - name: Compilar .ipa
        script: |
          flutter build ipa --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # 3) Android → Google Play (pista interna, como borrador). Se lanza a mano.
  android-play-store:
    name: Android · Play Store
    instance_type: linux_x2
    max_build_duration: 45
    working_directory: movil
    environment:
      flutter: stable
      android_signing:
        - glauren_keystore          # nombre del keystore que subas en Codemagic
      groups:
        - google_play               # grupo con GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        APP_ID: com.chaquetasdeprom.glauren
    scripts:
      - name: Preparar plataformas
        script: bash scripts/preparar_plataformas.sh
      - name: Revisar código
        script: flutter analyze --no-fatal-infos --no-fatal-warnings && flutter test
      - name: Compilar .aab
        script: |
          flutter build appbundle --release \
            --build-name=1.0.$PROJECT_BUILD_NUMBER \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
